art" font-weight="800" style="fill:var(--rs-fg, #1b1f2a)" class="q lb">2L</text><circle cx="190" cy="190" r="7" style="fill:hsl(28,90%,50%)"/><text x="178.0" y="194.0" font-size="11.5" text-anchor="end" font-weight="800" style="fill:var(--rs-fg, #1b1f2a)" class="q lb">4R</text><circle cx="256" cy="196" r="7" style="fill:hsl(28,90%,50%)"/><text x="268.0" y="200.0" font-size="11.5" text-anchor="start" font-weight="800" style="fill:var(--rs-fg, #1b1f2a)" class="q lb">4L</text><circle cx="340" cy="196" r="7" style="fill:hsl(28,90%,50%)"/><text x="352.0" y="200.0" font-size="11.5" text-anchor="start" font-weight="800" style="fill:var(--rs-fg, #1b1f2a)" class="q lb">5 (AP window)</text><circle cx="340" cy="150" r="7" style="fill:hsl(28,90%,50%)"/><text x="352.0" y="154.0" font-size="11.5" text-anchor="start" font-weight="800" style="fill:var(--rs-fg, #1b1f2a)" class="q lb">6 (para-aortic)</text><circle cx="230" cy="272" r="7" style="fill:hsl(28,90%,50%)"/><text x="230.0" y="296.0" font-size="11.5" text-anchor="middle" font-weight="800" style="fill:var(--rs-fg, #1b1f2a)" class="q lb">7 (subcarinal)</text><circle cx="110" cy="300" r="7" style="fill:hsl(140,60%,40%)"/><text x="98.0" y="304.0" font-size="11.5" text-anchor="end" font-weight="800" style="fill:var(--rs-fg, #1b1f2a)" class="q lb">10R hilar</text><circle cx="370" cy="300" r="7" style="fill:hsl(140,60%,40%)"/><text x="382.0" y="304.0" font-size="11.5" text-anchor="start" font-weight="800" style="fill:var(--rs-fg, #1b1f2a)" class="q lb">10L hilar</text><circle cx="80" cy="336" r="7" style="fill:hsl(140,60%,40%)"/><text x="92.0" y="340.0" font-size="11.5" text-anchor="start" font-weight="800" style="fill:var(--rs-fg, #1b1f2a)" class="q lb">11 interlobar</text><text x="8.0" y="18.0" font-size="10" text-anchor="start" font-weight="600" style="fill:var(--rs-muted, #5b6475)">Nodal stations (R tumour assumed) · patient right on left</text><text x="452.0" y="330.0" font-size="11" text-anchor="end" font-weight="800" style="