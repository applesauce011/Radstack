="end" font-weight="800" style="fill:var(--rs-fg, #1b1f2a)" class="q lb">Fossa navicularis</text><text x="116.0" y="162.0" font-size="10.5" text-anchor="start" font-weight="800" style="fill:var(--rs-fg, #1b1f2a)" class="q lb">Verumontanum (utricle)</text><text x="140.0" y="180.0" font-size="10.5" text-anchor="start" font-weight="800" style="fill:var(--rs-fg, #1b1f2a)" class="q lb">UG diaphragm</text><text x="20.0" y="272.0" font-size="11" text-anchor="start" font-weight="800" style="fill:hsl(28,90%,35%)">POSTERIOR: prostatic + membranous</text><text x="290.0" y="272.0" font-size="11" text-anchor="start" font-weight="800" style="fill:hsl(200,80%,35%)">ANTERIOR: bulbar + penile</text><text x="452.0" y="20.0" font-size="10.5" text-anchor="end" font-weight="700" style="fill:var(--rs-muted, #5b6475)">Straddle injury → bulbar (anterior)</text><text x="452.0" y="36.0" font-size="10.5" text-anchor="end" font-weight="700" style="fill:var(--rs-muted, #5b6475)">Pelvic fracture → posterior (membranous)</text><text x="452.0" y="52.0" font-size="10.5" text-anchor="end" font-weight="700" style="fill:var(--rs-muted, #5b6475)">Blood at meatus → RUG first</text></svg>
