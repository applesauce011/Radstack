<svg class="rs-diagram" data-diagram="gu-weigert" viewBox="0 0 460 330" role="img" aria-label="Weigert-Meyer rule" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;display:block"><defs><marker id="gu-weigert-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--rs-fg, #1b1f2a)"/></marker></defs><path d="M140,30 C96,26 76,80 82,140 C88,200 110,236 146,234 C176,232 188,200 180,170 C176,150 182,120 186,100 C192,60 174,32 140,30 Z" style="fill:hsla(355,45%,60%,.30);stroke:hsla(355,40%,38%,.85);stroke-width:2;stroke-linecap:round;stroke-linejoin:round"/><line x1="80.0" y1="134.0" x2="190.0" y2="130.0" style="stroke:hsla(355,40%,38%,.85);stroke-width:1.4;stroke-linecap:round;stroke-dasharray:4 3"/><path d="M170,80 C190,120 200,170 212,220 C224,262 236,284 238,300" style="fill:none;stroke:hsl(28,90%,48%);stroke-width:4;stroke-linecap:round;stroke-linejoin:round"/><path d="M176,176 C194,200 210,230 226,260 C240,280 258,292 272,296" style="fill:none;stroke:hsl(200,80%,45%);stroke-width:4;stroke-linecap:round;stroke-linejoin:round"/><path d="M200,250 C220,240 330,240 360,256 C380,290 360,326 280,326 C220,326 196,300 200,250 Z" style="fill:hsla(50,85%,60%,.30);stroke:hsla(45,80%,35%,.9);stroke-width:2;stroke-linecap:round;stroke-linejoin:round"/><circle cx="238" cy="304" r="12" style="fill:hsla(28,90%,60%,.5);stroke:hsl(28,90%,40%);stroke-width:2"/><circle cx="272" cy="296" r="4" style="fill:hsl(200,80%,40%)"/><path d="M140,84 C150,70 166,70 170,80" style="fill:none;stroke:hsl(28,90%,48%);stroke-width:7;stroke-linecap:round;stroke-linejoin:round"/><text x="130.0" y="64.0" font-size="11.5" text-anchor="middle" font-weight="800" style="fill:var(--rs-fg, #1b1f2a)">Upper moiety</text><text x="130.0" y="200.0" font-size="11.5" text-anchor="middle" font-weight="800" style="fill:var(--rs-fg, #1b1f2a)">Lower moiety</text><text x="262.0" y="40.0" font-size="11" text-anchor="start" font-weight="800" style="fill:hsl(28,90%,35%)" class="q lb">Upper pole: ectopic, low+medial</text><text x="262.0" y="58.0" font-size="11" text-anchor="start" font-weight="800" style="fill:hsl(28,90%,35%)" class="q lb">→ ureterocele, OBSTRUCTS</text><text x="262.0" y="110.0" font-size="11" text-anchor="start" font-weight="800" style="fill:hsl(200,80%,35%)" class="q lb">Lower pole: orthotopic</text><text x="262.0" y="128.0" font-size="11" text-anchor="start" font-weight="800" style="fill:hsl(200,80%,35%)" class="q lb">→ REFLUXES</text><text x="262.0" y="176.0" font-size="11" text-anchor="start" font-weight="800" style="fill:var(--rs-fg,#1b1f2a)" class="q lb">Dilated upper pole pushes</text><text x="262.0" y="194.0" font-size="11" text-anchor="start" font-weight="800" style="fill:var(--rs-fg,#1b1f2a)" class="q lb">lower pole down: drooping lily</text><text x="8.0" y="18.0" font-size="10.5" text-anchor="start" font-weight="600" style="fill:var(--rs-muted, #5b6475)">Complete duplication (Weigert-Meyer)</text><text x="226.0" y="324.0" font-size="10" text-anchor="end" font-weight="700" style="fill:var(--rs-muted, #5b6475)">ureterocele</text></svg>
