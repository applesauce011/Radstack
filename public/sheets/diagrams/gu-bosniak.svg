<svg class="rs-diagram" data-diagram="gu-bosniak" viewBox="0 0 460 230" role="img" aria-label="Bosniak 2019 cystic renal mass classification" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;display:block"><defs><marker id="gu-bosniak-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--rs-fg, #1b1f2a)"/></marker></defs><circle cx="46" cy="80" r="34" style="fill:hsla(200,40%,70%,.25);stroke:hsla(355,40%,38%,.85);stroke-width:1.6"/><text x="46.0" y="24.0" font-size="12.5" text-anchor="middle" font-weight="800" style="fill:hsl(140,70%,35%)">Bosniak I</text><text x="46.0" y="138.0" font-size="9.5" text-anchor="middle" font-weight="700" style="fill:var(--rs-fg, #1b1f2a)" class="q lb">thin ≤2 mm wall</text><text x="46.0" y="154.0" font-size="9.5" text-anchor="middle" font-weight="700" style="fill:var(--rs-muted, #5b6475)">no septa</text><circle cx="138" cy="80" r="34" style="fill:hsla(200,30%,60%,.35);stroke:hsla(355,40%,38%,.85);stroke-width:1.6"/><line x1="108.0" y1="74.0" x2="168.0" y2="84.0" style="stroke:hsla(355,40%,38%,.85);stroke-width:1.4;stroke-linecap:round"/><text x="138.0" y="24.0" font-size="12.5" text-anchor="middle" font-weight="800" style="fill:hsl(140,70%,35%)">Bosniak II</text><text x="138.0" y="138.0" font-size="9.5" text-anchor="middle" font-weight="700" style="fill:var(--rs-fg, #1b1f2a)" class="q lb">1–3 thin septa</text><text x="138.0" y="154.0" font-size="9.5" text-anchor="middle" font-weight="700" style="fill:var(--rs-muted, #5b6475)">or ≥70 HU ≤3 cm</text><circle cx="230" cy="80" r="34" style="fill:hsla(200,40%,70%,.25);stroke:hsla(355,40%,38%,.85);stroke-width:3"/><line x1="200.0" y1="66.0" x2="260.0" y2="70.0" style="stroke:hsla(355,40%,38%,.85);stroke-width:2.2;stroke-linecap:round"/><line x1="200.0" y1="80.0" x2="260.0" y2="84.0" style="stroke:hsla(355,40%,38%,.85);stroke-width:2.2;stroke-linecap:round"/><line x1="200.0" y1="94.0" x2="260.0" y2="98.0" style="stroke:hsla(355,40%,38%,.85);stroke-width:2.2;stroke-linecap:round"/><text x="230.0" y="24.0" font-size="12.5" text-anchor="middle" font-weight="800" style="fill:hsl(45,70%,35%)">Bosniak IIF</text><text x="230.0" y="138.0" font-size="9.5" text-anchor="middle" font-weight="700" style="fill:var(--rs-fg, #1b1f2a)" class="q lb">≥4 thin septa</text><text x="230.0" y="154.0" font-size="9.5" text-anchor="middle" font-weight="700" style="fill:var(--rs-muted, #5b6475)">or 3 mm smooth</text><circle cx="322" cy="80" r="34" style="fill:hsla(200,40%,70%,.25);stroke:hsla(355,40%,38%,.85);stroke-width:5"/><line x1="290.0" y1="80.0" x2="354.0" y2="86.0" style="stroke:hsl(0,72%,52%);stroke-width:5;stroke-linecap:round"/><text x="322.0" y="24.0" font-size="12.5" text-anchor="middle" font-weight="800" style="fill:hsl(28,70%,35%)">Bosniak III</text><text x="322.0" y="138.0" font-size="9.5" text-anchor="middle" font-weight="700" style="fill:var(--rs-fg, #1b1f2a)" class="q lb">≥4 mm wall</text><text x="322.0" y="154.0" font-size="9.5" text-anchor="middle" font-weight="700" style="fill:var(--rs-muted, #5b6475)">or septa (enh.)</text><circle cx="414" cy="80" r="34" style="fill:hsla(200,40%,70%,.25);stroke:hsla(355,40%,38%,.85);stroke-width:3"/><path d="M420,47 C444,54 438,84 418,76 Z" style="fill:hsl(0,72%,52%);opacity:.85"/><text x="414.0" y="24.0" font-size="12.5" text-anchor="middle" font-weight="800" style="fill:hsl(0,70%,35%)">Bosniak IV</text><text x="414.0" y="138.0" font-size="9.5" text-anchor="middle" font-weight="700" style="fill:var(--rs-fg, #1b1f2a)" class="q lb">enh. nodule</text><text x="414.0" y="154.0" font-size="9.5" text-anchor="middle" font-weight="700" style="fill:var(--rs-muted, #5b6475)">≥4 mm / acute</text><text x="230.0" y="182.0" font-size="11.5" text-anchor="middle" font-weight="800" style="fill:var(--rs-fg, #1b1f2a)">Risk: I–II <1% · IIF follow-up · III ~50% · IV ~90%</text><text x="230.0" y="202.0" font-size="10.5" text-anchor="middle" font-weight="600" style="fill:var(--rs-muted, #5b6475)">Red = enhancing tissue · calcification alone no longer upgrades</text><text x="230.0" y="220.0" font-size="10.5" text-anchor="middle" font-weight="700" style="fill:var(--rs-muted, #5b6475)">Enhancement: >20 HU definite · 10–20 equivocal · <10 none</text></svg>
