<svg class="rs-diagram" data-diagram="ir-upper-limb" viewBox="0 0 460 245" role="img" aria-label="Upper extremity arterial nomenclature" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;display:block"><defs><marker id="ir-upper-limb-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--rs-fg, #1b1f2a)"/></marker></defs><line x1="14.0" y1="70.0" x2="140.0" y2="70.0" style="stroke:hsl(0,80%,50%);stroke-width:10;stroke-linecap:butt"/><text x="77.0" y="54.0" font-size="13" text-anchor="middle" font-weight="800" style="fill:hsl(0,75%,40%)" class="q lb">Subclavian</text><line x1="140.0" y1="70.0" x2="260.0" y2="70.0" style="stroke:hsl(28,80%,50%);stroke-width:10;stroke-linecap:butt"/><text x="200.0" y="54.0" font-size="13" text-anchor="middle" font-weight="800" style="fill:hsl(28,75%,40%)" class="q lb">Axillary</text><line x1="260.0" y1="70.0" x2="372.0" y2="70.0" style="stroke:hsl(48,80%,50%);stroke-width:10;stroke-linecap:butt"/><text x="316.0" y="54.0" font-size="13" text-anchor="middle" font-weight="800" style="fill:hsl(48,75%,40%)" class="q lb">Brachial</text><path d="M372,70 Q400,60 446,44" style="fill:none;stroke:hsl(330,70%,50%);stroke-width:5;stroke-linecap:round;stroke-linejoin:round"/><text x="446.0" y="34.0" font-size="12.5" text-anchor="end" font-weight="800" style="fill:hsl(330,65%,45%)" class="q lb">Radial</text><path d="M372,70 Q400,82 446,98" style="fill:none;stroke:hsl(200,70%,45%);stroke-width:7;stroke-linecap:round;stroke-linejoin:round"/><text x="446.0" y="118.0" font-size="12.5" text-anchor="end" font-weight="800" style="fill:hsl(200,70%,38%)" class="q lb">Ulnar</text><line x1="140.0" y1="60.0" x2="140.0" y2="92.0" style="stroke:var(--rs-fg, #1b1f2a);stroke-width:2;stroke-linecap:round;stroke-dasharray:3 3"/><text x="140.0" y="106.0" font-size="11" text-anchor="middle" font-weight="600" style="fill:var(--rs-muted, #5b6475)" class="q lb">lateral border</text><text x="140.0" y="119.0" font-size="11" text-anchor="middle" font-weight="800" style="fill:var(--rs-fg, #1b1f2a)" class="q lb">1st rib</text><line x1="260.0" y1="60.0" x2="260.0" y2="92.0" style="stroke:var(--rs-fg, #1b1f2a);stroke-width:2;stroke-linecap:round;stroke-dasharray:3 3"/><text x="260.0" y="106.0" font-size="11" text-anchor="middle" font-weight="600" style="fill:var(--rs-muted, #5b6475)" class="q lb">lower border</text><text x="260.0" y="119.0" font-size="11" text-anchor="middle" font-weight="800" style="fill:var(--rs-fg, #1b1f2a)" class="q lb">TERES MAJOR</text><line x1="372.0" y1="60.0" x2="372.0" y2="92.0" style="stroke:var(--rs-fg, #1b1f2a);stroke-width:2;stroke-linecap:round;stroke-dasharray:3 3"/><text x="372.0" y="106.0" font-size="11" text-anchor="middle" font-weight="600" style="fill:var(--rs-muted, #5b6475)" class="q lb">radial head</text><text x="372.0" y="119.0" font-size="11" text-anchor="middle" font-weight="800" style="fill:var(--rs-fg, #1b1f2a)" class="q lb">(bifurcation)</text><text x="14.0" y="148.0" font-size="11" text-anchor="start" font-weight="800" style="fill:var(--rs-fg, #1b1f2a)">Subclavian branches (VITamin C & D):</text><text x="14.0" y="164.0" font-size="11" text-anchor="start" font-weight="500" style="fill:var(--rs-fg, #1b1f2a)">Vertebral · Int. thoracic · Thyrocervical · Costocervical · Dorsal scapular</text><text x="14.0" y="180.0" font-size="11" text-anchor="start" font-weight="500" style="fill:var(--rs-fg, #1b1f2a)">Ulnar: bigger, gives common interosseous → SUPERFICIAL arch</text><text x="14.0" y="196.0" font-size="11" text-anchor="start" font-weight="500" style="fill:var(--rs-fg, #1b1f2a)">Radial → DEEP arch · Allen test before radial access</text><text x="14.0" y="212.0" font-size="11" text-anchor="start" font-weight="500" style="fill:var(--rs-fg, #1b1f2a)">Scalene triangle: subclavian VEIN in front of anterior scalene;</text><text x="14.0" y="228.0" font-size="11" text-anchor="start" font-weight="500" style="fill:var(--rs-fg, #1b1f2a)">ARTERY + brachial plexus between anterior & middle scalene</text></svg>
