<svg class="rs-diagram" data-diagram="nucs-hida" viewBox="0 0 460 266" role="img" aria-label="HIDA flow" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;display:block"><defs><marker id="nucs-hida-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--rs-muted, #5b6475)"/></marker></defs><rect x="120" y="4" width="220" height="40" rx="10" style="fill:hsla(100,80%,55%,0.16);stroke:hsl(100,70%,45%);stroke-width:1.5"/><text x="230.0" y="28.9" text-anchor="middle" font-size="14" font-weight="700" style="fill:var(--rs-fg, #1b1f2a)">Inject HIDA, image 60 min</text><rect x="4" y="74" width="170" height="44" rx="10" style="fill:hsla(140,80%,55%,0.22);stroke:hsl(140,70%,45%);stroke-width:1.5"/><text x="89.0" y="100.9" text-anchor="middle" font-size="14" font-weight="700" style="fill:var(--rs-fg, #1b1f2a)">GB seen ≤ 60 min</text><rect x="4" y="130" width="170" height="50" rx="10" style="fill:hsla(140,80%,55%,0.08);stroke:hsl(140,70%,45%);stroke-width:1.5"/><text class="q" x="89.0" y="151.3" text-anchor="middle" font-size="13.5" font-weight="700" style="fill:var(--rs-fg, #1b1f2a)">Acute chole-</text><text class="q" x="89.0" y="168.2" text-anchor="middle" font-size="12.0" font-weight="400" style="fill:var(--rs-fg, #1b1f2a)">cystitis excluded</text><rect x="196" y="74" width="260" height="44" rx="10" style="fill:hsla(0,80%,55%,0.2);stroke:hsl(0,70%,45%);stroke-width:1.5"/><text x="326.0" y="100.9" text-anchor="middle" font-size="14" font-weight="700" style="fill:var(--rs-fg, #1b1f2a)">No GB at 60 min</text><rect x="196" y="128" width="260" height="52" rx="10" style="fill:hsla(0,80%,55%,0.12);stroke:hsl(0,70%,45%);stroke-width:1.5"/><text x="326.0" y="150.3" text-anchor="middle" font-size="13.5" font-weight="700" style="fill:var(--rs-fg, #1b1f2a)">Bowel seen → morphine</text><text class="q" x="326.0" y="167.2" text-anchor="middle" font-size="12.0" font-weight="400" style="fill:var(--rs-fg, #1b1f2a)">still no GB at 90 min = ACUTE</text><rect x="196" y="190" width="260" height="72" rx="10" style="fill:hsla(280,80%,55%,0.12);stroke:hsl(280,70%,45%);stroke-width:1.5"/><text x="326.0" y="213.8" text-anchor="middle" font-size="13.5" font-weight="700" style="fill:var(--rs-fg, #1b1f2a)">No bowel → delay to 4 h</text><text class="q" x="326.0" y="230.7" text-anchor="middle" font-size="12.0" font-weight="400" style="fill:var(--rs-fg, #1b1f2a)">pool clears = CBD obstruction</text><text class="q" x="326.0" y="247.6" text-anchor="middle" font-size="12.0" font-weight="400" style="fill:var(--rs-fg, #1b1f2a)">pool persists = hepatitis</text><path d="M230,44 C159.5,44 159.5,74 89,74" style="fill:none;stroke:var(--rs-muted, #5b6475);stroke-width:1.6" marker-end="url(#nucs-hida-arr)"/><path d="M230,44 C278.0,44 278.0,74 326,74" style="fill:none;stroke:var(--rs-muted, #5b6475);stroke-width:1.6" marker-end="url(#nucs-hida-arr)"/><line x1="89" y1="118" x2="89" y2="128" style="stroke:var(--rs-muted, #5b6475);stroke-width:1.6" marker-end="url(#nucs-hida-arr)"/><line x1="326" y1="118" x2="326" y2="126" style="stroke:var(--rs-muted, #5b6475);stroke-width:1.6" marker-end="url(#nucs-hida-arr)"/><path d="M200,96 C178,96 180,226 194,226" style="fill:none;stroke:var(--rs-muted, #5b6475);stroke-width:1.6" marker-end="url(#nucs-hida-arr)"/></svg>
