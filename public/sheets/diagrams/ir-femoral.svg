<svg class="rs-diagram" data-diagram="ir-femoral" viewBox="0 0 460 300" role="img" aria-label="Femoral access landmarks" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;display:block"><defs><marker id="ir-femoral-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--rs-fg, #1b1f2a)"/></marker></defs><circle cx="230" cy="178" r="52" style="fill:hsla(40,30%,60%,.3);stroke:hsla(40,30%,45%,.7);stroke-width:2"/><text x="186.0" y="228.0" font-size="10.5" text-anchor="end" font-weight="700" style="fill:var(--rs-muted, #5b6475)">femoral head</text><line x1="60.0" y1="82.0" x2="420.0" y2="112.0" style="stroke:hsl(45,80%,45%);stroke-width:3;stroke-linecap:round;stroke-dasharray:8 5"/><text x="420.0" y="104.0" font-size="11" text-anchor="end" font-weight="800" style="fill:hsl(45,80%,35%)" class="q lb">inguinal ligament</text><line x1="238.0" y1="6.0" x2="236.0" y2="104.0" style="stroke:hsl(0,72%,52%);stroke-width:9;stroke-linecap:round"/><text x="246.0" y="30.0" font-size="11.5" text-anchor="start" font-weight="700" style="fill:var(--rs-fg, #1b1f2a)" class="q lb">External iliac</text><path d="M236,96 Q210,80 196,46" style="fill:none;stroke:hsl(0,72%,52%);stroke-width:3;stroke-linecap:round;stroke-linejoin:round"/><text x="192.0" y="42.0" font-size="10.5" text-anchor="end" font-weight="700" style="fill:var(--rs-fg, #1b1f2a)" class="q lb">inf. epigastric</text><line x1="236.0" y1="104.0" x2="234.0" y2="218.0" style="stroke:hsl(0,72%,52%);stroke-width:9;stroke-linecap:round"/><text x="244.0" y="126.0" font-size="13" text-anchor="start" font-weight="800" style="fill:var(--rs-fg, #1b1f2a)" class="q lb">CFA</text><path d="M234,218 Q250,250 262,296" style="fill:none;stroke:hsl(0,72%,52%);stroke-width:7;stroke-linecap:round;stroke-linejoin:round"/><text x="268.0" y="290.0" font-size="11" text-anchor="start" font-weight="700" style="fill:var(--rs-fg, #1b1f2a)" class="q lb">SFA</text><path d="M234,218 Q214,250 200,296" style="fill:none;stroke:hsl(0,72%,52%);stroke-width:6;stroke-linecap:round;stroke-linejoin:round"/><text x="194.0" y="290.0" font-size="11" text-anchor="end" font-weight="700" style="fill:var(--rs-fg, #1b1f2a)" class="q lb">Profunda</text><rect x="200" y="148" width="70" height="46" rx="8" style="fill:hsla(140,70%,45%,.2);stroke:hsl(140,60%,40%);stroke-width:2"/><text x="196.0" y="168.0" font-size="11.5" text-anchor="end" font-weight="800" style="fill:hsl(140,60%,32%)" class="q lb">✓ IDEAL: CFA over</text><text x="196.0" y="182.0" font-size="11" text-anchor="end" font-weight="700" style="fill:hsl(140,60%,32%)" class="q lb">mid–lower femoral head</text><text x="16.0" y="128.0" font-size="11.5" text-anchor="start" font-weight="800" style="fill:var(--rs-red-fg, #b3001b)" class="q lb">✗ Too HIGH (above lig.)</text><text x="16.0" y="142.0" font-size="11" text-anchor="start" font-weight="600" style="fill:var(--rs-red-fg, #b3001b)" class="q lb">→ retroperitoneal bleed</text><text x="455.0" y="238.0" font-size="11.5" text-anchor="end" font-weight="800" style="fill:var(--rs-red-fg, #b3001b)" class="q lb">✗ Too LOW (below bifurcation)</text><text x="455.0" y="252.0" font-size="11" text-anchor="end" font-weight="600" style="fill:var(--rs-red-fg, #b3001b)" class="q lb">→ pseudoaneurysm / AVF</text><text x="8.0" y="18.0" font-size="10.5" text-anchor="start" font-weight="600" style="fill:var(--rs-muted, #5b6475)" class="q lb">Skin nick lies BELOW the arteriotomy</text><text x="8.0" y="31.0" font-size="10.5" text-anchor="start" font-weight="600" style="fill:var(--rs-muted, #5b6475)" class="q lb">(retrograde stick)</text></svg>
