<svg class="rs-diagram" data-diagram="gu-prostate" viewBox="0 0 460 250" role="img" aria-label="Prostate zonal anatomy and PI-RADS" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;display:block"><defs><marker id="gu-prostate-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--rs-fg, #1b1f2a)"/></marker></defs><ellipse cx="120" cy="120" rx="86" ry="64" style="fill:hsla(200,60%,70%,.3);stroke:hsla(200,40%,35%,.8);stroke-width:2"/><ellipse cx="120" cy="114" rx="50" ry="34" style="fill:hsla(30,70%,65%,.45);stroke:hsla(30,50%,35%,.8);stroke-width:2"/><path d="M60,70 C90,46 150,46 180,70 L160,82 C140,68 100,68 80,82 Z" style="fill:hsla(0,0%,55%,.35);stroke:hsla(0,0%,40%,.6);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round"/><circle cx="120" cy="126" r="5" style="fill:hsla(45,80%,35%,.9)"/><text x="120.0" y="62.0" font-size="10.5" text-anchor="middle" font-weight="800" style="fill:var(--rs-fg, #1b1f2a)" class="q lb">Anterior fibromuscular</text><text x="120.0" y="106.0" font-size="11" text-anchor="middle" font-weight="800" style="fill:var(--rs-fg, #1b1f2a)" class="q lb">Transition zone (BPH)</text><text x="120.0" y="166.0" font-size="11" text-anchor="middle" font-weight="800" style="fill:var(--rs-fg, #1b1f2a)" class="q lb">Peripheral zone (~70% CA)</text><text x="120.0" y="212.0" font-size="10" text-anchor="middle" font-weight="600" style="fill:var(--rs-muted, #5b6475)">Axial, mid gland · anterior up</text><text x="240.0" y="40.0" font-size="12" text-anchor="start" font-weight="800" style="fill:var(--rs-fg, #1b1f2a)">PI-RADS dominant sequence</text><text x="240.0" y="62.0" font-size="12" text-anchor="start" font-weight="800" style="fill:hsl(200,70%,35%)" class="q lb">PZ → DWI / ADC</text><text x="240.0" y="84.0" font-size="12" text-anchor="start" font-weight="800" style="fill:hsl(30,80%,35%)" class="q lb">TZ → T2</text><text x="240.0" y="106.0" font-size="11" text-anchor="start" font-weight="700" style="fill:var(--rs-muted, #5b6475)">DCE: upgrades PZ 3 → 4</text><text x="240.0" y="128.0" font-size="11" text-anchor="start" font-weight="700" style="fill:var(--rs-muted, #5b6475)">4 vs 5: <1.5 vs ≥1.5 cm</text><text x="240.0" y="150.0" font-size="11" text-anchor="start" font-weight="700" style="fill:var(--rs-muted, #5b6475)">Extraprostatic extension = 5</text><text x="240.0" y="172.0" font-size="11" text-anchor="start" font-weight="700" style="fill:var(--rs-muted, #5b6475)">TZ cancer: 'erased charcoal'</text><text x="240.0" y="194.0" font-size="11" text-anchor="start" font-weight="700" style="fill:var(--rs-muted, #5b6475)">Post-biopsy: haemorrhage</text><text x="240.0" y="216.0" font-size="11" text-anchor="start" font-weight="700" style="fill:var(--rs-muted, #5b6475)">exclusion sign (CA spared)</text></svg>
