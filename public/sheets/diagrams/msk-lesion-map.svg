<svg class="rs-diagram" data-diagram="msk-lesion-map" viewBox="0 0 460 360" role="img" aria-label="Bone lesion locations" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;display:block"><defs><marker id="msk-lesion-map-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--rs-fg, #1b1f2a)"/></marker></defs><path d="M60,330 L66,170 C50,150 40,110 48,80 C54,52 86,40 110,40 C134,40 166,52 172,80 C180,110 170,150 154,170 L160,330 Z" style="fill:hsla(35,35%,62%,.35);stroke:hsla(35,30%,40%,.85);stroke-width:2;stroke-linejoin:round"/><line x1="52.0" y1="96.0" x2="168.0" y2="96.0" style="stroke:var(--rs-fg, #1b1f2a);stroke-width:2;stroke-linecap:round;stroke-dasharray:4 3"/><text x="176.0" y="100.0" font-size="10.5" text-anchor="start" font-weight="700" style="fill:var(--rs-muted, #5b6475)">physis</text><text x="110.0" y="66.0" font-size="11" text-anchor="middle" font-weight="800" style="fill:hsl(0,70%,38%)">EPIPHYSIS</text><text x="110.0" y="140.0" font-size="11" text-anchor="middle" font-weight="800" style="fill:hsl(28,70%,38%)">METAPHYSIS</text><text x="110.0" y="260.0" font-size="11" text-anchor="middle" font-weight="800" style="fill:hsl(200,70%,38%)">DIAPHYSIS</text><text x="200.0" y="30.0" font-size="11.5" text-anchor="start" font-weight="800" style="fill:hsl(0,70%,34%)" class="q lb">Chondroblastoma (open physis)</text><text x="200.0" y="48.0" font-size="11.5" text-anchor="start" font-weight="800" style="fill:hsl(0,70%,34%)" class="q lb">Giant cell tumour (closed physis)</text><text x="200.0" y="66.0" font-size="11.5" text-anchor="start" font-weight="800" style="fill:hsl(0,70%,34%)" class="q lb">Clear cell chondrosarcoma</text><text x="200.0" y="84.0" font-size="11.5" text-anchor="start" font-weight="800" style="fill:hsl(0,70%,34%)" class="q lb">Infection, geode</text><text x="200.0" y="122.0" font-size="11.5" text-anchor="start" font-weight="800" style="fill:hsl(28,70%,34%)" class="q lb">Osteosarcoma</text><text x="200.0" y="140.0" font-size="11.5" text-anchor="start" font-weight="800" style="fill:hsl(28,70%,34%)" class="q lb">NOF / FCD (eccentric, cortical)</text><text x="200.0" y="158.0" font-size="11.5" text-anchor="start" font-weight="800" style="fill:hsl(28,70%,34%)" class="q lb">Simple bone cyst (central)</text><text x="200.0" y="176.0" font-size="11.5" text-anchor="start" font-weight="800" style="fill:hsl(28,70%,34%)" class="q lb">ABC (eccentric), osteochondroma</text><text x="200.0" y="194.0" font-size="11.5" text-anchor="start" font-weight="800" style="fill:hsl(28,70%,34%)" class="q lb">Chondromyxoid fibroma</text><text x="200.0" y="236.0" font-size="11.5" text-anchor="start" font-weight="800" style="fill:hsl(200,70%,34%)" class="q lb">Ewing (permeative, child)</text><text x="200.0" y="254.0" font-size="11.5" text-anchor="start" font-weight="800" style="fill:hsl(200,70%,34%)" class="q lb">Fibrous dysplasia (long lesion)</text><text x="200.0" y="272.0" font-size="11.5" text-anchor="start" font-weight="800" style="fill:hsl(200,70%,34%)" class="q lb">Adamantinoma / OFD (ant. tibia)</text><text x="200.0" y="290.0" font-size="11.5" text-anchor="start" font-weight="800" style="fill:hsl(200,70%,34%)" class="q lb">Osteoid osteoma (cortex)</text><text x="200.0" y="308.0" font-size="11.5" text-anchor="start" font-weight="800" style="fill:hsl(200,70%,34%)" class="q lb">Myeloma, lymphoma, EG</text><text x="200.0" y="340.0" font-size="10.5" text-anchor="start" font-weight="600" style="fill:var(--rs-muted, #5b6475)">Epiphyseal equivalents: patella, calcaneus,</text><text x="200.0" y="354.0" font-size="10.5" text-anchor="start" font-weight="600" style="fill:var(--rs-muted, #5b6475)">carpals, apophyses (greater troch.)</text></svg>
