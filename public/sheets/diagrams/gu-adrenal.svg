<svg class="rs-diagram" data-diagram="gu-adrenal" viewBox="0 0 460 330" role="img" aria-label="Adrenal mass workup" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;display:block"><defs><marker id="gu-adrenal-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--rs-fg, #1b1f2a)"/></marker></defs><rect x="150" y="10" width="160" height="34" rx="9" style="fill:hsla(220,40%,70%,.2);stroke:var(--rs-border,#dfe3ec);stroke-width:1.2"/><text x="230.0" y="31.0" font-size="11" text-anchor="middle" font-weight="800" style="fill:var(--rs-fg, #1b1f2a)">Incidental adrenal mass</text><rect x="10" y="74" width="128" height="40" rx="9" style="fill:hsla(140,60%,60%,.25);stroke:var(--rs-border,#dfe3ec);stroke-width:1.2"/><text x="74.0" y="91.0" font-size="11" text-anchor="middle" font-weight="800" style="fill:var(--rs-fg, #1b1f2a)">Macroscopic fat</text><text x="74.0" y="105.0" font-size="11" text-anchor="middle" font-weight="800" style="fill:var(--rs-fg, #1b1f2a)">→ Myelolipoma</text><line x1="170.0" y1="44.0" x2="80.0" y2="74.0" style="stroke:var(--rs-muted,#5b6475);stroke-width:1.8;stroke-linecap:round"/><path d="M80,74 l-5,-8 l10,0 Z" style="fill:var(--rs-muted,#5b6475)"/><line x1="230.0" y1="44.0" x2="230.0" y2="74.0" style="stroke:var(--rs-muted,#5b6475);stroke-width:1.8;stroke-linecap:round"/><path d="M230,74 l-5,-8 l10,0 Z" style="fill:var(--rs-muted,#5b6475)"/><rect x="160" y="74" width="140" height="40" rx="9" style="fill:hsla(220,40%,70%,.2);stroke:var(--rs-border,#dfe3ec);stroke-width:1.2"/><text x="230.0" y="98.0" font-size="11" text-anchor="middle" font-weight="800" style="fill:var(--rs-fg, #1b1f2a)">Unenhanced CT</text><rect x="322" y="74" width="128" height="40" rx="9" style="fill:hsla(140,60%,60%,.25);stroke:var(--rs-border,#dfe3ec);stroke-width:1.2"/><text x="386.0" y="91.0" font-size="11" text-anchor="middle" font-weight="800" style="fill:var(--rs-fg, #1b1f2a)">≤10 HU</text><text x="386.0" y="105.0" font-size="11" text-anchor="middle" font-weight="800" style="fill:var(--rs-fg, #1b1f2a)">→ Lipid-rich adenoma</text><line x1="300.0" y1="94.0" x2="318.0" y2="94.0" style="stroke:var(--rs-muted,#5b6475);stroke-width:1.8;stroke-linecap:round"/><path d="M322,94 l-8,-5 l0,10 Z" style="fill:var(--rs-muted,#5b6475)"/><line x1="230.0" y1="114.0" x2="230.0" y2="146.0" style="stroke:var(--rs-muted,#5b6475);stroke-width:1.8;stroke-linecap:round"/><path d="M230,146 l-5,-8 l10,0 Z" style="fill:var(--rs-muted,#5b6475)"/><text x="236.0" y="130.0" font-size="10.5" text-anchor="start" font-weight="800" style="fill:var(--rs-fg, #1b1f2a)" class="q lb">>10 HU</text><rect x="150" y="146" width="160" height="40" rx="9" style="fill:hsla(220,40%,70%,.2);stroke:var(--rs-border,#dfe3ec);stroke-width:1.2"/><text x="230.0" y="163.0" font-size="11" text-anchor="middle" font-weight="800" style="fill:var(--rs-fg, #1b1f2a)">Washout CT</text><text x="230.0" y="177.0" font-size="11" text-anchor="middle" font-weight="800" style="fill:var(--rs-fg, #1b1f2a)">(60 s + 15 min)</text><line x1="190.0" y1="186.0" x2="100.0" y2="218.0" style="stroke:var(--rs-muted,#5b6475);stroke-width:1.8;stroke-linecap:round"/><path d="M100,218 l-5,-8 l10,0 Z" style="fill:var(--rs-muted,#5b6475)"/><line x1="270.0" y1="186.0" x2="360.0" y2="218.0" style="stroke:var(--rs-muted,#5b6475);stroke-width:1.8;stroke-linecap:round"/><path d="M360,218 l-5,-8 l10,0 Z" style="fill:var(--rs-muted,#5b6475)"/><rect x="10" y="218" width="180" height="44" rx="9" style="fill:hsla(140,60%,60%,.25);stroke:var(--rs-border,#dfe3ec);stroke-width:1.2"/><text x="100.0" y="237.0" font-size="11" text-anchor="middle" font-weight="800" style="fill:var(--rs-fg, #1b1f2a)">Absolute >60% or</text><text x="100.0" y="251.0" font-size="11" text-anchor="middle" font-weight="800" style="fill:var(--rs-fg, #1b1f2a)">relative >40% → adenoma</text><rect x="270" y="218" width="180" height="44" rx="9" style="fill:hsla(0,70%,65%,.22);stroke:var(--rs-border,#dfe3ec);stroke-width:1.2"/><text x="360.0" y="237.0" font-size="11" text-anchor="middle" font-weight="800" style="fill:var(--rs-fg, #1b1f2a)">Below thresholds →</text><text x="360.0" y="251.0" font-size="11" text-anchor="middle" font-weight="800" style="fill:var(--rs-fg, #1b1f2a)">indeterminate (met? ACC?)</text><text x="230.0" y="288.0" font-size="10.5" text-anchor="middle" font-weight="700" style="fill:var(--rs-muted, #5b6475)">MRI: signal drop on OUT-of-phase = intracellular lipid (adenoma)</text><text x="230.0" y="306.0" font-size="10.5" text-anchor="middle" font-weight="700" style="fill:var(--rs-muted, #5b6475)">Absolute = (E−D)/(E−U) · Relative = (E−D)/E</text><text x="230.0" y="324.0" font-size="10" text-anchor="middle" font-weight="700" style="fill:var(--rs-muted, #5b6475)">T2 'light bulb' + avid enhancement → pheochromocytoma (check metanephrines)</text></svg>
